<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><b>หน้าเลือกประเภทลิงก์</b></title>
  <style>
    body {
      font-family: 'Sarabun', 'Prompt', sans-serif;
      background: linear-gradient(135deg, #e8f5f3 0%, #d4f1f4 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      box-sizing: border-box;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,150,136,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      color: #008858;
      text-align: center;
      font-weight: 600;
    }
    .btn-link {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 0.5rem 0;
      padding: 0.9rem 1.2rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #00a86b 0%, #008858 100%);
      text-align: center;
      transition: all 0.3s ease;
      box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(0,136,88,0.3);
    }
    .btn-link:hover {
      background: linear-gradient(135deg, #00c97d 0%, #006d45 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0,136,88,0.4);
    }
    @media (max-width: 600px) {
      .container {
        padding: 1rem;
        max-width: 100%;
        border-radius: 0;
        box-shadow: none;
      }
      h1 {
        font-size: 1.1rem;
      }
      .btn-link {
        font-size: 1rem;
        padding: 0.7rem 0.8rem;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>เลือกประเภทลิงก์ที่ต้องการทดสอบ</h1>
    <a class="btn-link" href="https.html">HTTPS</a>
    <a class="btn-link" href="deeplink.html">Deeplink</a>
    <a class="btn-link" href="qrlogin.html">Sample QR Login</a>
    <a class="btn-link" href="https://czp.dga.or.th/cportal/sdk/landing/index.html">czp Landing page</a>
  </div>
</body>
</html>
